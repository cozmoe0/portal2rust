[package]
name = "portal2"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A Portal 2 engine reimplementation written in Rust on top of Bevy"

[dependencies]
bevy.workspace = true
portal2_core.workspace = true
portal2_render.workspace = true
portal2_audio.workspace = true
portal2_ui.workspace = true
portal2_world.workspace = true
portal2_particles.workspace = true
portal2_game.workspace = true
source_formats.workspace = true
ciborium.workspace = true

[features]
# `--probe` also lists the rendered meshes the view ray passes through.
probe-mesh = ["bevy/mesh_picking"]
# Writes a Chrome trace of every system's timing (open it in ui.perfetto.dev).
trace = ["bevy/trace_chrome"]

# In the browser: WebGPU, the canvas and JavaScript interop.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["web", "webgpu"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Location", "Document", "Element", "HtmlCanvasElement"] }
# The heap allocator, growing the page's memory in large steps.
dlmalloc = "0.2"

# Save times are shown in local time, converted as the game does on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Time"] }

[lints]
workspace = true
