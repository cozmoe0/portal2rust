[package]
name = "portal2_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The portal2rust interface toolkit: VGUI schemes, layouts and fonts, close captions and Bink video playback"

[dependencies]
bevy.workspace = true
bytemuck.workspace = true
portal2_core.workspace = true
portal2_audio.workspace = true
source_formats.workspace = true
bink.workspace = true

# Fonts are rasterized with GDI, as the game does on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi"] }
