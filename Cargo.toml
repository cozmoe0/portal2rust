[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { version = "0.20", features = ["serialize"] }
glam = "0.33"
thiserror = "2"
log = "0.4"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"

# Workspace crates.
source_formats = { path = "crates/source_formats" }
squirrel = { path = "crates/squirrel" }
bink = { path = "crates/bink" }
portal2_core = { path = "crates/portal2_core" }
portal2_render = { path = "crates/portal2_render" }

# Engine crates build fast in dev; dependencies (Bevy, wgpu, physics) get full
# optimisation so the game stays playable in debug builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Video decoding runs every frame of the menus.
[profile.dev.package.bink]
opt-level = 3

[profile.release]
codegen-units = 16
lto = "thin"
