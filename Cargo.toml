[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = "0.20"
glam = "0.33"
thiserror = "2"
log = "0.4"
bytemuck = { version = "1", features = ["derive"] }

# Engine crates build fast in dev; dependencies (Bevy, wgpu, physics) get full
# optimisation so the game stays playable in debug builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 16
lto = "thin"
